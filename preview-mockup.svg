<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2918"/>
      <stop offset="100%" stop-color="#06150b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <linearGradient id="ndvi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="inner-shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Ambient Outer Background -->
  <rect width="1200" height="680" rx="20" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- Main Browser Window Mockup -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="1120" height="620" rx="16" fill="#FAF8F5"/>
    
    <!-- Browser Top Bar -->
    <path d="M 0,16 Q 0,0 16,0 L 1104,0 Q 1120,0 1120,16 L 1120,44 L 0,44 Z" fill="#EAE5DC"/>
    
    <!-- Traffic Light Controls -->
    <circle cx="24" cy="22" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="22" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="22" r="6" fill="#27C93F"/>

    <!-- URL Bar -->
    <rect x="220" y="10" width="680" height="24" rx="6" fill="#FFFFFF" stroke="#D5CFC5" stroke-width="1"/>
    <g transform="translate(232, 16)" fill="#666">
      <!-- Lock icon -->
      <path d="M 4,5 L 4,3 C 4,1.3 5.3,0 7,0 C 8.7,0 10,1.3 10,3 L 10,5 L 12,5 L 12,12 L 2,12 L 2,5 Z M 5,5 L 9,5 L 9,3 C 9,1.9 8.1,1 7,1 C 5.9,1 5,1.9 5,3 Z" fill="#10b981"/>
      <text x="18" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#2e4235" font-weight="600">
        https://krishi-sahay.onrender.com <tspan fill="#888">— National Agriculture Public Good Network</tspan>
      </text>
    </g>

    <!-- App Header & Navigation Bar inside App -->
    <g transform="translate(0, 44)">
      <rect width="1120" height="60" fill="#143D23"/>
      
      <!-- Brand Logo -->
      <g transform="translate(24, 16)">
        <rect width="28" height="28" rx="8" fill="#10b981"/>
        <path d="M 14,8 C 11,8 8,11 8,14 C 11,14 14,11 14,8 Z M 14,14 C 14,17 17,20 20,20 C 20,17 17,14 14,14 Z" fill="#FFFFFF"/>
        <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
          Krishisahay <tspan font-size="13" font-weight="600" fill="#86efac">कृषि सहाय</tspan>
        </text>
      </g>

      <!-- Language Ribbon -->
      <g transform="translate(380, 17)">
        <!-- Hindi (Active) -->
        <rect x="0" y="0" width="58" height="26" rx="13" fill="#10b981"/>
        <text x="29" y="17" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">हिन्दी</text>
        
        <!-- Other Languages -->
        <g fill="#A7D4B6" font-family="sans-serif" font-size="11" font-weight="600">
          <text x="90" y="17">తెలుగు</text>
          <text x="145" y="17">தமிழ்</text>
          <text x="195" y="17">मराठी</text>
          <text x="250" y="17">ગુજરાતી</text>
          <text x="310" y="17">বাংলা</text>
          <text x="365" y="17">ಕನ್ನಡ</text>
          <text x="420" y="17">ਪੰਜਾਬੀ</text>
          <text x="478" y="17">English</text>
        </g>
      </g>

      <!-- District Selector Badge -->
      <g transform="translate(950, 16)">
        <rect width="146" height="28" rx="8" fill="#1B4D2E" stroke="#2D6A42" stroke-width="1"/>
        <circle cx="16" cy="14" r="4" fill="#34d399"/>
        <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Punjab • Ludhiana</text>
      </g>
    </g>

    <!-- App Body Content Showcase -->
    <g transform="translate(24, 120)">
      
      <!-- Card 1: Hyperlocal Agro-Weather & Soil Moisture (Left Column Top) -->
      <g transform="translate(0, 0)">
        <rect width="340" height="240" rx="14" fill="#FFFFFF" stroke="#E6E0D4" stroke-width="1"/>
        
        <rect x="16" y="14" width="70" height="20" rx="6" fill="#ECFDF5"/>
        <text x="51" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#047857">LIVE TELEMETRY</text>
        
        <text x="16" y="58" font-family="sans-serif" font-size="16" font-weight="800" fill="#1C1917">Agro-Climatic Intelligence</text>
        <text x="16" y="74" font-family="sans-serif" font-size="11" fill="#78716C">Ludhiana Agro-Ecological Sub-Zone #3</text>

        <!-- Metric Badges Grid -->
        <g transform="translate(16, 90)">
          <!-- Temp -->
          <rect x="0" y="0" width="146" height="54" rx="8" fill="#FBF9F5" stroke="#EAE5DC" stroke-width="1"/>
          <text x="12" y="20" font-family="sans-serif" font-size="10" fill="#78716C">TEMPERATURE</text>
          <text x="12" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#1C1917">28.4°C</text>

          <!-- Soil Moisture -->
          <rect x="162" y="0" width="146" height="54" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
          <text x="174" y="20" font-family="sans-serif" font-size="10" fill="#15803D" font-weight="700">ROOT MOISTURE</text>
          <text x="174" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#14532D">42.8%</text>

          <!-- Safe Spray Alert -->
          <rect x="0" y="64" width="308" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
          <circle cx="16" cy="81" r="5" fill="#10B981"/>
          <text x="28" y="85" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">
            Safe Spray Window Active: Wind 6 km/h, Rain 5%
          </text>
        </g>

        <!-- NPK Guidance snippet -->
        <g transform="translate(16, 204)">
          <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#57534E">
            Soil Health Card: <tspan fill="#15803D" font-weight="800">Reduce Urea 25%</tspan> • Apply 4t FYM
          </text>
        </g>
      </g>

      <!-- Card 2: Multimodal Crop Disease AI Verdict (Center Column) -->
      <g transform="translate(360, 0)">
        <rect width="380" height="240" rx="14" fill="#FFFFFF" stroke="#E6E0D4" stroke-width="1"/>
        
        <rect x="16" y="14" width="116" height="20" rx="6" fill="#FEF3C7"/>
        <text x="74" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#92400E">GEMINI MULTIMODAL AI</text>

        <text x="16" y="58" font-family="sans-serif" font-size="16" font-weight="800" fill="#1C1917">Crop Diagnostic Verdict</text>
        <text x="16" y="74" font-family="sans-serif" font-size="11" fill="#78716C">Specimen: Wheat Leaf (Triticum aestivum)</text>

        <!-- Diagnosis Result Box -->
        <g transform="translate(16, 88)">
          <rect width="348" height="66" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
          <text x="14" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#991B1B">
            Yellow Rust (Puccinia striiformis)
          </text>
          <rect x="250" y="10" width="86" height="20" rx="10" fill="#DC2626"/>
          <text x="293" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">94% CONFIDENCE</text>
          
          <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#7F1D1D">
            Symptoms: Linear yellow-orange pustules, leaf chlorosis
          </text>
          <text x="14" y="58" font-family="sans-serif" font-size="10" font-weight="700" fill="#B91C1C">
            Risk: High • Contagious transboundary fungal spread
          </text>
        </g>

        <!-- Organic Prescription -->
        <g transform="translate(16, 166)">
          <rect width="348" height="58" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
          <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#166534">
            ORGANIC BIO-PROTECTANT FORMULATION
          </text>
          <text x="12" y="34" font-family="sans-serif" font-size="11" font-weight="600" fill="#14532D">
            Spray 5% Neem Seed Kernel Extract (NSKE) @ 5ml/L
          </text>
          <text x="12" y="48" font-family="sans-serif" font-size="10" fill="#15803D">
            Add Trichoderma viride bio-fungicide @ 5g/L during dusk
          </text>
        </g>
      </g>

      <!-- Card 3: Advanced Agronomist Spectral Cockpit (Right Column Top) -->
      <g transform="translate(760, 0)">
        <rect width="312" height="240" rx="14" fill="#FFFFFF" stroke="#E6E0D4" stroke-width="1"/>
        
        <rect x="16" y="14" width="138" height="20" rx="6" fill="#F3E8FF"/>
        <text x="85" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#6B21A8">SENTINEL-2 COCKPIT</text>

        <text x="16" y="58" font-family="sans-serif" font-size="16" font-weight="800" fill="#1C1917">NDVI Radiometric Canvas</text>
        <text x="16" y="74" font-family="sans-serif" font-size="11" fill="#78716C">Resolution: 10m Ground Sample (MSI)</text>

        <!-- Mockup Canvas Shader Box -->
        <g transform="translate(16, 88)">
          <rect width="280" height="106" rx="8" fill="url(#ndvi-grad)"/>
          
          <!-- Cadastral plot grid overlay -->
          <rect x="14" y="10" width="110" height="86" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
          <rect x="134" y="10" width="130" height="42" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
          <rect x="134" y="58" width="130" height="38" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>

          <!-- Crosshair Telemetry HUD -->
          <rect x="22" y="54" width="124" height="36" rx="6" fill="#0A0A0A" opacity="0.88"/>
          <text x="30" y="68" font-family="monospace" font-size="9" font-weight="700" fill="#34D399">NDVI: 0.74 (Healthy)</text>
          <text x="30" y="82" font-family="monospace" font-size="9" fill="#93C5FD">Moist: 41% • Temp: 29°C</text>
        </g>

        <!-- Spectral band tabs -->
        <g transform="translate(16, 204)" font-family="sans-serif" font-size="10" font-weight="700">
          <rect x="0" y="0" width="48" height="22" rx="4" fill="#15803D"/>
          <text x="24" y="14" text-anchor="middle" fill="#FFF">NDVI</text>

          <rect x="54" y="0" width="50" height="22" rx="4" fill="#EAE5DC"/>
          <text x="79" y="14" text-anchor="middle" fill="#57534E">NDWI</text>

          <rect x="110" y="0" width="60" height="22" rx="4" fill="#EAE5DC"/>
          <text x="140" y="14" text-anchor="middle" fill="#57534E">Thermal</text>

          <rect x="176" y="0" width="68" height="22" rx="4" fill="#EAE5DC"/>
          <text x="210" y="14" text-anchor="middle" fill="#57534E">Moisture</text>
        </g>
      </g>

      <!-- Row 2: APMC Mandi Rates & Voice Krishi Mitra Audio Companion -->
      <g transform="translate(0, 256)">
        <!-- Card 4: APMC Mandi Price Board -->
        <rect width="680" height="200" rx="14" fill="#FFFFFF" stroke="#E6E0D4" stroke-width="1"/>
        
        <g transform="translate(20, 20)">
          <text x="0" y="16" font-family="sans-serif" font-size="15" font-weight="800" fill="#1C1917">
            Real-Time APMC Mandi Rates & Arbitrage Corridors
          </text>
          <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#78716C">
            Official Agmarknet Gateway • Daily Price Movements
          </text>
          
          <!-- Mandi Table Header -->
          <g transform="translate(0, 48)">
            <rect width="640" height="26" fill="#F5F3EF" rx="4"/>
            <text x="16" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#57534E">COMMODITY</text>
            <text x="160" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#57534E">MARKET (APMC)</text>
            <text x="310" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#57534E">MODAL PRICE</text>
            <text x="430" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#57534E">PRICE RANGE</text>
            <text x="540" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#57534E">DAILY TREND</text>
          </g>

          <!-- Row 1 -->
          <g transform="translate(0, 80)">
            <text x="16" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#1C1917">Wheat (Kanak)</text>
            <text x="160" y="14" font-family="sans-serif" font-size="12" fill="#44403C">Khanna, Punjab</text>
            <text x="310" y="14" font-family="sans-serif" font-size="13" font-weight="800" fill="#15803D">₹2,425 / Qtl</text>
            <text x="430" y="14" font-family="sans-serif" font-size="11" fill="#78716C">₹2,380 - ₹2,460</text>
            <rect x="540" y="2" width="70" height="18" rx="4" fill="#DCFCE7"/>
            <text x="575" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#166534">+₹85 ▲</text>
          </g>

          <!-- Row 2 -->
          <g transform="translate(0, 108)">
            <text x="16" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#1C1917">Cotton (Kapas)</text>
            <text x="160" y="14" font-family="sans-serif" font-size="12" fill="#44403C">Abohar, Punjab</text>
            <text x="310" y="14" font-family="sans-serif" font-size="13" font-weight="800" fill="#15803D">₹7,150 / Qtl</text>
            <text x="430" y="14" font-family="sans-serif" font-size="11" fill="#78716C">₹6,900 - ₹7,300</text>
            <rect x="540" y="2" width="70" height="18" rx="4" fill="#DCFCE7"/>
            <text x="575" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#166534">+₹140 ▲</text>
          </g>
        </g>

        <!-- Card 5: Voice Krishi Mitra Assistant (Bottom Right) -->
        <g transform="translate(700, 0)">
          <rect width="372" height="200" rx="14" fill="#143D23"/>
          
          <g transform="translate(20, 20)">
            <circle cx="16" cy="16" r="16" fill="#10B981"/>
            <!-- Mic Icon -->
            <path d="M 16,9 C 14.5,9 13.5,10 13.5,11.5 L 13.5,16 C 13.5,17.5 14.5,18.5 16,18.5 C 17.5,18.5 18.5,17.5 18.5,16 L 18.5,11.5 C 18.5,10 17.5,9 16,9 Z M 11.5,14.5 C 11.5,17 13.5,19 16,19 C 18.5,19 20.5,17 20.5,14.5" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
            
            <text x="42" y="16" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">
              Voice Krishi Mitra (आवाज़ साथी)
            </text>
            <text x="42" y="30" font-family="sans-serif" font-size="10" fill="#A7D4B6">
              Neural Multilingual Speech in 9 Dialects
            </text>

            <!-- Audio Waveform Simulation -->
            <g transform="translate(0, 48)">
              <rect width="332" height="42" rx="8" fill="#0C2516" stroke="#1F4D30" stroke-width="1"/>
              
              <!-- Waveform Bars -->
              <g fill="#34D399" transform="translate(16, 21)">
                <rect x="0" y="-6" width="3" height="12" rx="1.5"/>
                <rect x="6" y="-12" width="3" height="24" rx="1.5"/>
                <rect x="12" y="-18" width="3" height="36" rx="1.5"/>
                <rect x="18" y="-8" width="3" height="16" rx="1.5"/>
                <rect x="24" y="-15" width="3" height="30" rx="1.5"/>
                <rect x="30" y="-10" width="3" height="20" rx="1.5"/>
                <rect x="36" y="-4" width="3" height="8" rx="1.5"/>
                <rect x="42" y="-14" width="3" height="28" rx="1.5"/>
                <rect x="48" y="-18" width="3" height="36" rx="1.5"/>
                <rect x="54" y="-10" width="3" height="20" rx="1.5"/>
                <rect x="60" y="-6" width="3" height="12" rx="1.5"/>
              </g>

              <text x="96" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#86EFAC">
                "आपकी गेहूं की फसल में पीला रतुआ..."
              </text>
            </g>

            <!-- Prompt chip -->
            <g transform="translate(0, 102)">
              <rect width="332" height="26" rx="13" fill="#1C4F2F" stroke="#2A6B42" stroke-width="1"/>
              <text x="166" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#D1FAE5">
                🎙️ Tap to Speak: "टमाटर में फल छेदक के उपाय बताएं"
              </text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
